AWSTemplateFormatVersion: '2010-09-09'
Description: SSH security groups
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  SshCidr:
    Type: String
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
Resources:
  PublicSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from the student IPv4 only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  PrivateSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from the public EC2 security group only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !GetAtt PublicSg.GroupId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
Outputs:
  PublicSgId: {Value: !GetAtt PublicSg.GroupId}
  PrivateSgId: {Value: !GetAtt PrivateSg.GroupId}
