AWSTemplateFormatVersion: '2010-09-09'
Description: NT548 Lab 1 nested stacks
Parameters:
  ProjectName: {Type: String, Default: nt548-cfn}
  VpcCidr: {Type: String, Default: 10.10.0.0/16}
  PublicSubnetCidr: {Type: String, Default: 10.10.1.0/24}
  PrivateSubnetCidr: {Type: String, Default: 10.10.2.0/24}
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
  SshCidr:
    Type: String
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  AmiId: {Type: 'AWS::EC2::Image::Id'}
  KeyName: {Type: 'AWS::EC2::KeyPair::KeyName'}
  InstanceType: {Type: String, Default: t3.micro}
Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: modules/network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCidr: !Ref VpcCidr
        PublicSubnetCidr: !Ref PublicSubnetCidr
        PrivateSubnetCidr: !Ref PrivateSubnetCidr
        AvailabilityZone: !Ref AvailabilityZone
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: modules/security.yaml
      Parameters:
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        SshCidr: !Ref SshCidr
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: modules/compute.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        AmiId: !Ref AmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        PublicSubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
        PrivateSubnetId: !GetAtt NetworkStack.Outputs.PrivateSubnetId
        PublicSgId: !GetAtt SecurityStack.Outputs.PublicSgId
        PrivateSgId: !GetAtt SecurityStack.Outputs.PrivateSgId
Outputs:
  VpcId: {Value: !GetAtt NetworkStack.Outputs.VpcId}
  PublicSubnetId: {Value: !GetAtt NetworkStack.Outputs.PublicSubnetId}
  PrivateSubnetId: {Value: !GetAtt NetworkStack.Outputs.PrivateSubnetId}
  IgwId: {Value: !GetAtt NetworkStack.Outputs.IgwId}
  DefaultSgId: {Value: !GetAtt NetworkStack.Outputs.DefaultSgId}
  NatId: {Value: !GetAtt NetworkStack.Outputs.NatId}
  NatEip: {Value: !GetAtt NetworkStack.Outputs.NatEip}
  PublicRouteTableId: {Value: !GetAtt NetworkStack.Outputs.PublicRouteTableId}
  PrivateRouteTableId: {Value: !GetAtt NetworkStack.Outputs.PrivateRouteTableId}
  PublicSgId: {Value: !GetAtt SecurityStack.Outputs.PublicSgId}
  PrivateSgId: {Value: !GetAtt SecurityStack.Outputs.PrivateSgId}
  PublicInstanceId: {Value: !GetAtt ComputeStack.Outputs.PublicInstanceId}
  PrivateInstanceId: {Value: !GetAtt ComputeStack.Outputs.PrivateInstanceId}
  PublicIp: {Value: !GetAtt ComputeStack.Outputs.PublicIp}
  PublicPrivateIp: {Value: !GetAtt ComputeStack.Outputs.PublicPrivateIp}
  PrivateIp: {Value: !GetAtt ComputeStack.Outputs.PrivateIp}
